<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 평가 및 과제 제출 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        /* 파스텔 톤 배경 및 커스텀 스크롤바 */
        body { background-color: #f3f8f6; } 
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb { background-color: #c1d3c8; border-radius: 4px; }
        textarea::-webkit-scrollbar-track { background-color: #f1f5f9; }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #7dd3fc;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 flex flex-col h-[90vh]">
        <!-- 헤더 영역 -->
        <div class="bg-indigo-50 px-8 py-6 border-b border-indigo-100">
            <h1 class="text-2xl sm:text-3xl font-bold text-indigo-900 text-center tracking-tight">📝 글쓰기 피드백 및 제출 시스템</h1>
            <p class="text-center text-indigo-600 mt-2 text-sm sm:text-base">글을 작성하고 인공지능 피드백을 받은 후, 선생님께 과제를 제출하세요.</p>
        </div>

        <!-- 본문 영역 (스크롤 가능) -->
        <div class="flex-1 overflow-y-auto p-6 sm:p-8 space-y-6 bg-[#fafcfa]">
            
            <!-- 인적사항 입력란 -->
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1">
                    <label for="studentId" class="block text-sm font-semibold text-gray-700 mb-1">학번</label>
                    <input type="text" id="studentId" placeholder="예) 10101" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition text-lg">
                </div>
                <div class="flex-1">
                    <label for="studentName" class="block text-sm font-semibold text-gray-700 mb-1">이름</label>
                    <input type="text" id="studentName" placeholder="예) 홍길동" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition text-lg">
                </div>
            </div>

            <!-- 글쓰기 영역 -->
            <div class="flex flex-col relative">
                <label for="essayContent" class="block text-sm font-semibold text-gray-700 mb-1 flex justify-between items-end">
                    <span>과제 내용</span>
                    <span id="charCount" class="text-indigo-600 font-medium bg-indigo-50 px-3 py-1 rounded-full text-sm">0 자 (빈칸 포함)</span>
                </label>
                <textarea id="essayContent" rows="12" placeholder="이곳에 과제 내용을 작성해주세요..." class="w-full px-5 py-4 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition text-lg leading-relaxed resize-y"></textarea>
            </div>

            <!-- AI 피드백 결과 영역 (초기엔 숨김) -->
            <div id="feedbackSection" class="hidden bg-emerald-50 rounded-2xl p-6 border border-emerald-100 shadow-inner mt-4">
                <h3 class="text-lg font-bold text-emerald-800 mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    AI 튜터 피드백
                </h3>
                <div id="feedbackContent" class="text-emerald-900 text-base leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div class="bg-gray-50 px-8 py-5 border-t border-gray-100 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <button id="btnFeedback" class="w-full sm:w-auto px-6 py-3 bg-white text-indigo-600 font-semibold rounded-xl border-2 border-indigo-200 hover:bg-indigo-50 hover:border-indigo-300 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition shadow-sm flex items-center justify-center">
                <span id="feedbackBtnText">💡 피드백 받기</span>
                <span id="feedbackLoader" class="loader ml-2 hidden"></span>
            </button>
            <button id="btnSubmit" class="w-full sm:w-auto px-8 py-3 bg-indigo-500 text-white font-semibold rounded-xl hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-200 transition shadow-md flex items-center justify-center">
                <span id="submitBtnText">📤 과제 제출</span>
                <span id="submitLoader" class="loader border-t-white ml-2 hidden"></span>
            </button>
        </div>
    </div>

    <!-- 모달(알림창) 컴포넌트 -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50 p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <h3 id="modalTitle" class="text-xl font-bold text-gray-900 mb-2">알림</h3>
            <p id="modalMessage" class="text-gray-600 mb-6 text-base"></p>
            <button id="btnModalClose" class="w-full bg-indigo-500 text-white font-semibold py-3 rounded-xl hover:bg-indigo-600 transition">확인</button>
        </div>
    </div>

    <script>
        // DOM 요소
        const studentId = document.getElementById('studentId');
        const studentName = document.getElementById('studentName');
        const essayContent = document.getElementById('essayContent');
        const charCount = document.getElementById('charCount');
        
        const btnFeedback = document.getElementById('btnFeedback');
        const feedbackBtnText = document.getElementById('feedbackBtnText');
        const feedbackLoader = document.getElementById('feedbackLoader');
        const feedbackSection = document.getElementById('feedbackSection');
        const feedbackContent = document.getElementById('feedbackContent');
        
        const btnSubmit = document.getElementById('btnSubmit');
        const submitBtnText = document.getElementById('submitBtnText');
        const submitLoader = document.getElementById('submitLoader');

        const modal = document.getElementById('customModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const btnModalClose = document.getElementById('btnModalClose');

        // ==========================================
        // ⚙️ 선생님 설정 영역
        // 1. 여기에 선생님이 배포하신 Google Apps Script 웹앱 URL을 입력하세요.
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7vMZV2WWT8pXyThi-Mi_xN8RjL1Hw70Ym8qJs-FYlTkjmoUUwwvxGXb7rCTirXchY/exec"; 
        // ==========================================

        // 커스텀 모달 함수 (alert 대체)
        function showAlert(title, message, isSuccess = false) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            modalTitle.className = isSuccess ? 'text-xl font-bold text-emerald-600 mb-2' : 'text-xl font-bold text-red-600 mb-2';
            modal.classList.remove('hidden');
            // 애니메이션을 위해 약간의 지연 시간 적용
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        btnModalClose.addEventListener('click', () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        });

        // 1. 글자 수 세기 (빈칸 포함)
        essayContent.addEventListener('input', () => {
            const length = essayContent.value.length;
            charCount.innerText = `${length.toLocaleString()} 자 (빈칸 포함)`;
        });

        // 2. 피드백 받기 (안전한 백엔드 경유 방식)
        btnFeedback.addEventListener('click', async () => {
            const text = essayContent.value.trim();
            if (!text) {
                showAlert('입력 오류', '과제 내용을 먼저 작성해주세요.');
                return;
            }

            if (!GOOGLE_SCRIPT_URL) {
                showAlert('설정 오류', '선생님 설정 영역에 GOOGLE_SCRIPT_URL을 입력해주세요.');
                return;
            }

            // 로딩 상태 표시
            btnFeedback.disabled = true;
            feedbackBtnText.innerText = '평가 중...';
            feedbackLoader.classList.remove('hidden');
            feedbackSection.classList.add('hidden');

            try {
                // 직접 Gemini API를 호출하지 않고, 선생님의 구글 스크립트로 '피드백' 요청을 보냅니다.
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    // CORS 오류 방지를 위해 text/plain 사용 (백엔드에서 JSON 파싱 가능)
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'feedback', // 피드백 요청임을 알림
                        essay: text
                    })
                });

                const result = await response.json();
                
                if (result.status === 'success' && result.feedback) {
                    feedbackContent.innerText = result.feedback;
                    feedbackSection.classList.remove('hidden');
                    feedbackSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    throw new Error(result.message || "피드백을 생성하지 못했습니다.");
                }

            } catch (error) {
                console.error(error);
                showAlert('오류 발생', '피드백을 가져오는 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.');
            } finally {
                btnFeedback.disabled = false;
                feedbackBtnText.innerText = '💡 피드백 받기';
                feedbackLoader.classList.add('hidden');
            }
        });

        // 3. 과제 제출하기
        btnSubmit.addEventListener('click', async () => {
            const id = studentId.value.trim();
            const name = studentName.value.trim();
            const text = essayContent.value.trim();

            if (!id || !name) {
                showAlert('입력 오류', '학번과 이름을 모두 입력해주세요.');
                return;
            }
            if (!text) {
                showAlert('입력 오류', '제출할 과제 내용이 없습니다.');
                return;
            }

            // 스크립트 URL이 설정되지 않은 경우 (데모 모드)
            if (!GOOGLE_SCRIPT_URL) {
                btnSubmit.disabled = true;
                submitBtnText.innerText = '제출 중...';
                submitLoader.classList.remove('hidden');
                
                setTimeout(() => {
                    btnSubmit.disabled = false;
                    submitBtnText.innerText = '📤 과제 제출';
                    submitLoader.classList.add('hidden');
                    showAlert('성공 (데모)', `[${id} ${name}] 학생의 과제가 제출되었습니다.\n\n(참고: 실제 제출을 위해서는 코드 내 GOOGLE_SCRIPT_URL을 입력해야 합니다.)`, true);
                }, 1500);
                return;
            }

            // 실제 제출 로직
            btnSubmit.disabled = true;
            submitBtnText.innerText = '제출 중...';
            submitLoader.classList.remove('hidden');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'submit', // 제출 요청임을 알림
                        studentId: id,
                        studentName: name,
                        essay: text
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showAlert('제출 완료', `🎉 ${name} 학생의 과제가 성공적으로 제출되었습니다. 수고하셨습니다!`, true);
                } else {
                    throw new Error(result.message);
                }
                
            } catch (error) {
                console.error(error);
                showAlert('전송 실패', '과제 제출 중 오류가 발생했습니다. 네트워크 상태를 확인하거나 선생님께 문의하세요.');
            } finally {
                btnSubmit.disabled = false;
                submitBtnText.innerText = '📤 과제 제출';
                submitLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
